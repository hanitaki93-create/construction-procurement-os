name: B04-B06 Surgical Web Optional Prop Fix

on:
  push:
    branches: [build/b04-b06-procurement-wave]
    paths:
      - '.github/workflows/ci-b04-b06-fix-web-optional-prop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b04-b06-procurement-wave
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Align local modal optional error typing with exact optional semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web-internal/src/main.tsx';
          const source = fs.readFileSync(path, 'utf8');
          const from = 'error?:string}){return <div className="form-sheet">';
          const to = 'error?:string|undefined}){return <div className="form-sheet">';
          const count = source.split(from).length - 1;
          if (count !== 1) throw new Error(`expected one ModalForm optional error type, found ${count}`);
          fs.writeFileSync(path, source.replace(from, to));
          NODE
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cpos/web-internal typecheck
          pnpm --filter @cpos/web-internal build
          git diff --check
          git diff -- apps/web-internal/src/main.tsx
          git config user.name 'cpos-ci-remediation'
          git config user.email 'cpos-ci-remediation@users.noreply.github.com'
          git add apps/web-internal/src/main.tsx
          git commit -m 'fix: align dashboard optional error prop typing'
          git push origin HEAD:build/b04-b06-procurement-wave
