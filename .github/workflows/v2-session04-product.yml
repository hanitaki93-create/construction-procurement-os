name: V2 Session 04 Bid Comparison

on:
  push:
    branches:
      - build/v2-session-04-bid-comparison
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web-internal/**'
      - 'packages/contracts/**'
      - 'packages/database-core/**'
      - 'packages/platform-application/**'
      - 'migrations/sql/000019_v2_session04_bid_comparison.sql'
      - 'migrations/sql/000020_v2_session04_comparison_row_uniqueness.sql'
      - 'migrations/sql/000021_v2_session04_comparison_rebase_guards.sql'
      - 'migrations/sql/000022_v2_session04_comparison_invariant_authority_remediation.sql'
      - 'migrations/sql/000023_v2_session04_platform_c2_slot_overlap_repair.sql'
      - '.github/workflows/v2-session04-product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-session04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpos_test
      MIGRATIONS_DIR: ../../migrations/sql
      BUILD_ID: v2-session04-ci

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Capability authority stays green
        run: pnpm product:capabilities:authorize
      - name: Build generated type dependencies
        run: |
          pnpm --filter @cpos/contracts build
          pnpm --filter @cpos/ui-foundation build
      - name: Typecheck changed product packages
        run: |
          pnpm --filter @cpos/contracts typecheck
          pnpm --filter @cpos/database-core typecheck
          pnpm --filter @cpos/platform-application typecheck
          pnpm --filter @cpos/api typecheck
          pnpm --filter @cpos/web-internal typecheck
      - name: Unit tests
        run: |
          pnpm --filter @cpos/contracts test
          pnpm --filter @cpos/api test
      - name: Build product surfaces
        run: |
          pnpm --filter @cpos/platform-application build
          pnpm --filter @cpos/api build
          pnpm --filter @cpos/web-internal build
      - name: Run full PostgreSQL hostile integration suite
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="${RUNNER_TEMP}/v2-session04-db-integration.log"
          if pnpm db:integration 2>&1 | tee "${LOG_FILE}"; then
            exit 0
          fi

          echo "::group::Full PostgreSQL hostile integration failure tail"
          tail -n 180 "${LOG_FILE}" || true
          echo "::endgroup::"
          {
            echo '### Session 04 PostgreSQL hostile integration failure'
            echo '```text'
            tail -n 180 "${LOG_FILE}" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          ANNOTATION="$(tail -n 140 "${LOG_FILE}" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(s.replace(/%/g,'%25').replace(/\\r/g,'%0D').replace(/\\n/g,'%0A')))" )"
          echo "::error title=Session 04 PostgreSQL hostile integration failure::${ANNOTATION}"
          exit 1
      - name: Rebuild committed migrations and scan catalog
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:status
          pnpm db:scan
