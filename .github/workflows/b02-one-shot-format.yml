name: B02 One-Shot Format

on:
  push:
    branches:
      - build/b02-platform-saas-provisional
    paths:
      - '.github/workflows/b02-one-shot-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b02-platform-saas-provisional
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier \
            packages/contracts/src \
            packages/database-core/src \
            packages/database-core/integration \
            scripts/lib/boundary-checker.mjs \
            scripts/lib/boundary-checker.test.mjs \
            scripts/lib/database-public-surface.mjs \
            scripts/lib/database-public-surface.test.mjs \
            --write
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/src packages/database-core/src packages/database-core/integration scripts/lib/boundary-checker.mjs scripts/lib/boundary-checker.test.mjs scripts/lib/database-public-surface.mjs scripts/lib/database-public-surface.test.mjs
          git commit -m 'Normalize B02 code with pinned Prettier before C1 gate'
          git push origin HEAD:build/b02-platform-saas-provisional
