name: B02 One-Shot Format

on:
  push:
    branches:
      - build/b02-platform-saas-provisional
    paths:
      - '.github/workflows/b02-one-shot-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b02-platform-saas-provisional
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Apply exact optional-property fix and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/contracts/src/platform.ts')
          s = p.read_text()
          old1 = """export function isOfferingAvailableAt(offering: ProductOfferingVersion, at: string): boolean {\n  return isEffectiveAt(\n    {\n      effectiveFrom: offering.availableFrom,\n      effectiveUntil: offering.availableUntil,\n    },\n    at,\n  );\n}\n"""
          new1 = """export function isOfferingAvailableAt(offering: ProductOfferingVersion, at: string): boolean {\n  const period: EffectivePeriod =\n    offering.availableUntil === undefined\n      ? { effectiveFrom: offering.availableFrom }\n      : { effectiveFrom: offering.availableFrom, effectiveUntil: offering.availableUntil };\n  return isEffectiveAt(period, at);\n}\n"""
          old2 = """  assertEffectivePeriod({\n    effectiveFrom: offering.availableFrom,\n    effectiveUntil: offering.availableUntil,\n  });\n"""
          new2 = """  const availabilityPeriod: EffectivePeriod =\n    offering.availableUntil === undefined\n      ? { effectiveFrom: offering.availableFrom }\n      : { effectiveFrom: offering.availableFrom, effectiveUntil: offering.availableUntil };\n  assertEffectivePeriod(availabilityPeriod);\n"""
          if old1 not in s or old2 not in s:
              raise SystemExit('expected exact type-fix patterns not found')
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
          pnpm exec prettier --write packages/contracts/src/platform.ts
          pnpm --filter @cpos/contracts typecheck
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cpos-ci'
          git config user.email 'cpos-ci@users.noreply.github.com'
          git add packages/contracts/src/platform.ts
          git commit -m 'B02 fix exact optional offering periods'
          git push origin HEAD:build/b02-platform-saas-provisional
