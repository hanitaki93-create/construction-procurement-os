name: B04-B06 Surgical Fixture Context Fix

on:
  push:
    branches: [build/b04-b06-procurement-wave]
    paths:
      - '.github/workflows/ci-b04-b06-fix-fixture-context.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpos_test
      MIGRATIONS_DIR: ../../migrations/sql
      BUILD_ID: b04-b06-fixture-remediation
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cpos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b04-b06-procurement-wave
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Correct predecessor-governed project-version fixture seeding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/database-core/integration/procurement-wave-test-support.ts';
          let source = fs.readFileSync(path, 'utf8');
          const from = `  await pool.query(\n    \`INSERT INTO platform.project_version (project_id,tenant_id,version,project_code,display_name,lifecycle_state,effective_period)\n     VALUES\n       ($1,$2,1,'UAQ-001','UAQ Villa','ACTIVE',tstzrange('2026-01-01',NULL,'[)')),\n       ($3,$4,1,'OTHER-001','Other Tenant Project','ACTIVE',tstzrange('2026-01-01',NULL,'[)'))\`,\n    [projectA, tenantA, projectB, tenantB],\n  );\n`;
          const to = `  await pool.query('BEGIN');\n  try {\n    await pool.query(\"SELECT set_config('cpos.tenant_id', $1, true)\", [tenantA]);\n    await pool.query(\"SELECT set_config('cpos.principal_id', $1, true)\", [ownerPrincipal]);\n    await pool.query(\n      \`INSERT INTO platform.project_version (\n         project_id,tenant_id,version,project_code,display_name,lifecycle_state,effective_period\n       ) VALUES ($1,$2,1,'UAQ-001','UAQ Villa','ACTIVE',tstzrange('2026-01-01',NULL,'[)'))\`,\n      [projectA, tenantA],\n    );\n    await pool.query('COMMIT');\n  } catch (error: unknown) {\n    await pool.query('ROLLBACK');\n    throw error;\n  }\n`;
          const count = source.split(from).length - 1;
          if (count !== 1) throw new Error(`expected one direct dual-tenant project-version seed, found ${count}`);
          source = source.replace(from, to);
          fs.writeFileSync(path, source);
          NODE
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cpos/database-core typecheck
          pnpm --filter @cpos/database-core exec vitest run --config vitest.integration.config.ts \
            integration/platform-b04-evidence-files.integration.test.ts \
            integration/platform-b05-requirements-allocation.integration.test.ts \
            integration/platform-b06-sourcing-rfq.integration.test.ts
          pnpm db:integration
          git diff --check
          git diff -- packages/database-core/integration/procurement-wave-test-support.ts
          git config user.name 'cpos-ci-remediation'
          git config user.email 'cpos-ci-remediation@users.noreply.github.com'
          git add packages/database-core/integration/procurement-wave-test-support.ts
          git commit -m 'test: seed B04-B06 project version under governed owner context'
          git push origin HEAD:build/b04-b06-procurement-wave
