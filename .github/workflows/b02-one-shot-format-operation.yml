name: B02 One-Shot Format Operation Test

on:
  push:
    branches:
      - build/b02-platform-saas-provisional
    paths:
      - '.github/workflows/b02-one-shot-format-operation.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b02-platform-saas-provisional
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Format one file
        run: pnpm exec prettier --write packages/contracts/src/operation.test.ts
      - name: Commit formatting only if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'cpos-ci'
          git config user.email 'cpos-ci@users.noreply.github.com'
          git add packages/contracts/src/operation.test.ts
          git commit -m 'B02 format operation entitlement fixture'
          git push origin HEAD:build/b02-platform-saas-provisional
