name: V2 Session 01 product

on:
  push:
    branches:
      - build/v2-session-01-foundation-supplier-mr
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web-internal/**'
      - 'packages/contracts/**'
      - 'packages/database-core/**'
      - 'packages/platform-application/**'
      - 'packages/ui-foundation/**'
      - 'migrations/sql/000014_v2_session01_supplier_mr.sql'
      - 'migrations/sql/000015_v2_session01_mr_review_route.sql'
      - '.github/workflows/v2-session01-product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-session01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpos_test
      MIGRATIONS_DIR: ../../migrations/sql
      BUILD_ID: v2-session01-ci

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Capability authority stays green
        run: pnpm product:capabilities:authorize
      - name: Build generated type dependencies
        run: |
          pnpm --filter @cpos/contracts build
          pnpm --filter @cpos/ui-foundation build
      - name: Typecheck changed product packages
        run: |
          pnpm --filter @cpos/contracts typecheck
          pnpm --filter @cpos/database-core typecheck
          pnpm --filter @cpos/platform-application typecheck
          pnpm --filter @cpos/api typecheck
          pnpm --filter @cpos/web-internal typecheck
      - name: Unit tests
        run: |
          pnpm --filter @cpos/contracts test
          pnpm --filter @cpos/api test
      - name: Build product surfaces
        run: |
          pnpm --filter @cpos/platform-application build
          pnpm --filter @cpos/api build
          pnpm --filter @cpos/web-internal build
      - name: Apply all migrations
        run: pnpm db:migrate
      - name: Verify tenant isolation invariant
        run: pnpm --filter @cpos/database-core exec vitest run integration/procurement-v2-session01.integration.test.ts -t "isolates supplier rows by the active tenant context" --reporter=verbose
      - name: Verify inactive-entitlement write denial
        run: pnpm --filter @cpos/database-core exec vitest run integration/procurement-v2-session01.integration.test.ts -t "denies supplier writes when the tenant has no active product entitlement" --reporter=verbose
      - name: Verify concurrent MR numbering invariant
        run: pnpm --filter @cpos/database-core exec vitest run integration/procurement-v2-session01.integration.test.ts -t "serializes concurrent MR number allocation within one project/year scope" --reporter=verbose
      - name: Run Session 01 hostile PostgreSQL tests
        run: pnpm --filter @cpos/database-core exec vitest run integration/procurement-v2-session01.integration.test.ts --reporter=verbose
      - name: Run full PostgreSQL integration suite
        run: pnpm db:integration
      - name: Scan migrated catalog
        run: |
          pnpm db:status
          pnpm db:scan