name: B04-B06 Surgical Service Context Fix

on:
  push:
    branches: [build/b04-b06-procurement-wave]
    paths:
      - '.github/workflows/ci-b04-b06-fix-service-context.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b04-b06-procurement-wave
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Preserve governed service contextual typing without runtime changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/procurement-application/src/index.ts';
          const source = fs.readFileSync(path, 'utf8');
          const from = '\n  });\n}\n';
          const to = '\n  } satisfies GovernedProcurementService);\n}\n';
          const count = source.split(from).length - 1;
          if (count !== 1) throw new Error(`expected exactly one service terminator, found ${count}`);
          fs.writeFileSync(path, source.replace(from, to));
          NODE
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cpos/procurement-application typecheck
          git diff --check
          git diff -- packages/procurement-application/src/index.ts
          git config user.name 'cpos-ci-remediation'
          git config user.email 'cpos-ci-remediation@users.noreply.github.com'
          git add packages/procurement-application/src/index.ts
          git commit -m 'fix: preserve governed procurement service contextual typing'
          git push origin HEAD:build/b04-b06-procurement-wave
