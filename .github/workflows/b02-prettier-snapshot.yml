name: B02 Prettier Snapshot

on:
  push:
    branches:
      - ci/b02-prettier-snapshot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install exact graph
        run: pnpm install --frozen-lockfile
      - name: Format only target files
        run: |
          pnpm exec prettier --write \
            packages/database-core/integration/migrations.integration.test.ts \
            packages/database-core/integration/platform-c1-c2-audit-remediation.integration.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database-core/integration/migrations.integration.test.ts \
            packages/database-core/integration/platform-c1-c2-audit-remediation.integration.test.ts
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:ci/b02-prettier-snapshot
