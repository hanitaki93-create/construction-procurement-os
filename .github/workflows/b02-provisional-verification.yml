name: B02 Provisional Verification

on:
  pull_request:
    branches:
      - build/b01-engineering-foundation
    paths:
      - '.github/workflows/b02-provisional-verification.yml'
      - '04_phases/phase_2_build_decomposition/**'
      - 'apps/api/**'
      - 'apps/web-internal/**'
      - 'migrations/**'
      - 'package.json'
      - 'packages/database-core/**'
      - 'packages/contracts/**'
      - 'packages/invariant-compiler/**'
      - 'packages/ui-foundation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/check-boundaries.mjs'
      - 'scripts/check-database-public-surface.mjs'
      - 'scripts/lib/boundary-checker.mjs'
      - 'scripts/lib/boundary-checker.test.mjs'
      - 'scripts/lib/database-public-surface.mjs'
      - 'scripts/lib/database-public-surface.test.mjs'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b02-provisional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgresql:
    name: PostgreSQL 18.4 execution-context regression
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpos_test
      MIGRATIONS_DIR: ../../migrations/sql
      BUILD_ID: b02-provisional-ci

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate exact pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"

      - name: Install exact dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify database package and hostile architecture guards
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @cpos/database-core typecheck
          node scripts/check-boundaries.mjs
          node scripts/check-database-public-surface.mjs

      - name: Verify B02 product shell
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @cpos/contracts typecheck
          pnpm --filter @cpos/api typecheck
          pnpm --filter @cpos/api test
          pnpm --filter @cpos/ui-foundation build
          pnpm --filter @cpos/web-internal typecheck
          pnpm --filter @cpos/web-internal build

      - name: Smoke interactive B02 product shell
        shell: bash
        run: |
          set -euo pipefail

          API_PORT=43117
          WEB_PORT=43118
          API_ORIGIN="http://127.0.0.1:${API_PORT}"
          WEB_ORIGIN="http://127.0.0.1:${WEB_PORT}"
          API_LOG="${RUNNER_TEMP}/cpos-b02-api.log"
          WEB_LOG="${RUNNER_TEMP}/cpos-b02-web.log"

          APP_ENV=development \
          CPOS_DEMO_MODE=true \
          HOST=127.0.0.1 \
          PORT="${API_PORT}" \
          LOG_LEVEL=error \
          node apps/api/dist/main.js >"${API_LOG}" 2>&1 &
          API_PID=$!

          CPOS_API_ORIGIN="${API_ORIGIN}" \
          pnpm --filter @cpos/web-internal exec vite \
            --host 127.0.0.1 \
            --port "${WEB_PORT}" \
            --strictPort >"${WEB_LOG}" 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "${WEB_PID}" "${API_PID}" 2>/dev/null || true
            wait "${WEB_PID}" "${API_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS "${API_ORIGIN}/health/live" >/dev/null \
              && curl -fsS "${WEB_ORIGIN}/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "${ready}" != "true" ]]; then
            cat "${API_LOG}" || true
            cat "${WEB_LOG}" || true
            exit 1
          fi

          SESSION_HEADERS=(
            -H 'x-cpos-session-mode: development'
            -H 'x-cpos-tenant-id: 019d1111-1111-7111-8111-111111111111'
            -H 'x-cpos-principal-id: 019d3333-3333-7333-8333-333333333333'
          )

          WORKSPACE="$(curl -fsS "${SESSION_HEADERS[@]}" "${WEB_ORIGIN}/platform/workspace")"
          grep -Fq '"displayName":"CPOS Demo Contractor"' <<<"${WORKSPACE}"
          grep -Fq '"projectCode":"JP-047"' <<<"${WORKSPACE}"

          CREATED="$(curl -fsS \
            "${SESSION_HEADERS[@]}" \
            -H 'content-type: application/json' \
            -X POST \
            --data '{"projectCode":"CI-001","displayName":"CI Runtime Project"}' \
            "${WEB_ORIGIN}/platform/projects")"
          grep -Fq '"projectCode":"CI-001"' <<<"${CREATED}"

          AFTER="$(curl -fsS "${SESSION_HEADERS[@]}" "${WEB_ORIGIN}/platform/workspace")"
          grep -Fq '"projectCode":"CI-001"' <<<"${AFTER}"

          echo 'B02_PRODUCT_SHELL_RUNTIME_SMOKE_PASS'

      - name: Run PostgreSQL integration suite
        shell: bash
        run: pnpm db:integration

      - name: Rebuild committed migrations and scan catalog
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:status
          pnpm db:scan
