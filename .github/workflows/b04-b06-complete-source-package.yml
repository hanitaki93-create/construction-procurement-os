name: B04-B06 Complete-Source Independent Audit Package

on:
  push:
    branches: [audit/b04-b06-complete-source-20260812]
    paths:
      - '.github/workflows/b04-b06-complete-source-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 15
    env:
      TARGET_SHA: b6a3a6f76c6a8baa33dd6b4f30c26228fca511d5
      TARGET_TREE: ef75470e7a66b0e23f730966a13acf22880af0a5
      TECHNICAL_RUN: '31607931222'
      TECHNICAL_JOB: '94151564073'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/b04-b06-complete-source-20260812
          fetch-depth: 0
          persist-credentials: true
      - name: Build and verify complete target source package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "${TARGET_TREE}"
          rm -rf _source audit_package
          mkdir -p _source audit_package
          git archive --format=tar "${TARGET_SHA}" > audit_package/B04_B06_COMPLETE_SOURCE.tar
          gzip -n -c audit_package/B04_B06_COMPLETE_SOURCE.tar > audit_package/B04_B06_COMPLETE_SOURCE.tar.gz
          sha256sum audit_package/B04_B06_COMPLETE_SOURCE.tar audit_package/B04_B06_COMPLETE_SOURCE.tar.gz > audit_package/ARCHIVE_SHA256.txt
          git ls-tree -r --name-only "${TARGET_SHA}" | LC_ALL=C sort > audit_package/EXPECTED_GIT_TRACKED_FILES.txt
          tar -tf audit_package/B04_B06_COMPLETE_SOURCE.tar | sed '/\/$/d' | LC_ALL=C sort > audit_package/ARCHIVE_FILES.txt
          diff -u audit_package/EXPECTED_GIT_TRACKED_FILES.txt audit_package/ARCHIVE_FILES.txt
          test "$(wc -l < audit_package/EXPECTED_GIT_TRACKED_FILES.txt)" -eq "$(wc -l < audit_package/ARCHIVE_FILES.txt)"
          tar -xf audit_package/B04_B06_COMPLETE_SOURCE.tar -C _source
          git ls-tree -r "${TARGET_SHA}" > audit_package/TARGET_GIT_TREE.txt
          find _source -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > audit_package/EXTRACTED_REGULAR_FILE_SHA256.txt
          cat > audit_package/AUDIT_TARGET.md <<EOF
          # B04-B06 Combined Independent Hostile Audit Target
          - Repository: hanitaki93-create/construction-procurement-os
          - Exact technically verified target commit: ${TARGET_SHA}
          - Exact target tree: ${TARGET_TREE}
          - Focused verification run: ${TECHNICAL_RUN}
          - Verification job: ${TECHNICAL_JOB}
          - Runner: eth-sim-cpos-ci-01
          - Technical result: PASS — compiler/typecheck, architecture, contracts/tests, application/API/dashboard, full PostgreSQL hostile integration, migrations/status/catalog scan.
          - B01/B02/B03 predecessor lineage: frozen canonical predecessor; already independently hostile-audited PASS and owner-accepted before this wave.
          - B07: OUT OF SCOPE.
          - SSV-1: DEFERRED, NOT WAIVED.
          ## Complete-source guarantee
          B04_B06_COMPLETE_SOURCE.tar was produced directly by git archive ${TARGET_SHA}.
          Its non-directory archive inventory must exactly match git ls-tree -r --name-only ${TARGET_SHA}; package construction fails on any missing or extra tracked path.
          _source/ is the extracted complete archive. TARGET_GIT_TREE.txt records every tracked Git blob/mode/path, and SHA-256 manifests cover the archives and extracted regular files.
          EOF
          cat > audit_package/INDEPENDENT_HOSTILE_AUDIT_PROMPT.md <<'EOF'
          # Independent hostile audit — B04/B05/B06 combined successor wave
          You are the independent hostile auditor. Audit the complete source under `_source/` as the exact target identified in `AUDIT_TARGET.md`. Do not trust summaries, green CI, prior author claims, or intended behavior where source proves otherwise.
          ## Non-negotiable boundaries
          1. B01/B02/B03 semantics are frozen predecessor semantics. They were previously independently hostile-audited PASS and owner-accepted. B04/B05/B06 may depend on them but may not weaken, reinterpret, bypass, or silently fork them.
          2. Audit B04, B05 and B06 as one combined successor wave, including cross-block interactions.
          3. B07 is out of scope. Do not recommend starting B07 as a remedy.
          4. SSV-1 remains deferred, not waived.
          5. Missing source required to substantiate a claim means BLOCKED / AUDIT NOT RUN for that claim, never PASS. Identify any material source omission if you can prove one.
          6. Do not weaken a frozen invariant merely to align tests or current implementation.
          ## Required source surfaces
          Inspect all relevant tracked source, not only changed files. At minimum include migrations 000014–000016 and predecessor migrations/triggers; contracts/public exports; database-core runtime/integration tests/shared fixtures; object-store and platform/procurement application layers; API routes/auth/context/error mapping/tests; internal dashboard and API assumptions; config/TypeScript/workspace/scripts/migration/catalog checks/focused workflow; manifests/lockfile where toolchain behavior matters.
          ## Hostile attack areas
          Attempt to falsify tenant isolation, execution-context and authority scope; role escalation; predecessor guards; version/effective-period history; B04 upload/finalization/object-SHA/accept-reject/immutability/idempotency/concurrency/provenance; B05 requirement/package/allocation arithmetic/over-allocation/concurrency/tenant/status bypass; B06 sourcing/RFQ/invite/grant/addenda/issue/revoke/transfer/stale-authority/idempotency/concurrency; direct-SQL invariant bypass; transaction/write-skew/lost-update races; API parsing/context/validation/response mismatches; dashboard claims/actions versus proven backend behavior; migration replay/catalog drift; any weakening of B01–B03.
          ## Evidence standard
          For every blocker or material concern cite concrete file paths and line ranges/functions, explain the exploit/failure path, expected invariant, demonstrated violation, and smallest safe remediation. Review tests critically for vacuity, false positives or fixture masking.
          ## Verdict contract
          End with exactly one overall verdict: PASS only if B04+B05+B06 are acceptable as a combined successor wave with no unresolved blocker; FAIL if demonstrated blockers exist; BLOCKED if independent substantiation cannot be completed because material evidence/source is unavailable. A partial pass is not an overall PASS. Do not authorize deployment or B07 in FAIL/BLOCKED.
          Required final sections: Overall verdict; Blocking findings; Non-blocking observations; Frozen-predecessor regression assessment; B04; B05; B06; Cross-block/concurrency; Dashboard/API consistency; Source-completeness; SSV-1 statement `deferred, not waived`.
          EOF
          cat > audit_package/TECHNICAL_VERIFICATION_EVIDENCE.md <<EOF
          # Technical verification evidence
          Exact target ${TARGET_SHA} passed focused B04-B06 verification on eth-sim-cpos-ci-01.
          - Workflow run: ${TECHNICAL_RUN}
          - Job: ${TECHNICAL_JOB}
          - Result: SUCCESS
          - Toolchain: Node 24.18.0, pnpm 10.34.0, frozen lockfile, PostgreSQL 18.4.
          - Gates: database-core typecheck; architecture boundary scan; database public-surface scan; contracts typecheck/tests; object-store typecheck/tests; platform/procurement application typechecks; API typecheck/tests; UI foundation build; dashboard typecheck/build; full PostgreSQL hostile integration; migration rebuild/status/catalog scan.
          This evidence is not a substitute for independent audit.
          EOF
          cat > audit_package/PACKAGE_STATUS.txt <<EOF
          PACKAGE_STATUS=COMPLETE_SOURCE_READY_FOR_INDEPENDENT_AUDIT
          TARGET_SHA=${TARGET_SHA}
          TARGET_TREE=${TARGET_TREE}
          TECHNICAL_VERIFICATION=PASS
          TECHNICAL_RUN=${TECHNICAL_RUN}
          INDEPENDENT_AUDIT=NOT_YET_RUN
          B07=OUT_OF_SCOPE
          SSV_1=DEFERRED_NOT_WAIVED
          EOF
          git diff --check -- audit_package _source
          echo "tracked_source_files=$(wc -l < audit_package/EXPECTED_GIT_TRACKED_FILES.txt)"
          echo "archive_sha256=$(cut -d' ' -f1 audit_package/ARCHIVE_SHA256.txt | head -n1)"
      - name: Commit complete-source package only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cpos-audit-package'
          git config user.email 'cpos-audit-package@users.noreply.github.com'
          git add audit_package _source
          git diff --cached --check
          git commit -m 'audit: build complete-source B04-B06 independent hostile package'
          git push origin HEAD:audit/b04-b06-complete-source-20260812
# registration retrigger
