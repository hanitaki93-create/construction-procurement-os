name: MR S03 Live Entry Fix

on:
  push:
    branches:
      - build/v2-erp-shell-requisition-slice
    paths:
      - '.github/workflows/mr-s03-live-entry-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/v2-erp-shell-requisition-slice
          fetch-depth: 0
      - name: Patch actual ERP entry and browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mr-s03-live-entry-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-internal/src/main-erp.tsx apps/web-internal/src/erp-requisition-s03.tsx deploy/erp-slice-03/browser-smoke.mjs
          git commit -m 'fix(erp): render MR S03 from the actual ERP entry'
          git push origin HEAD:build/v2-erp-shell-requisition-slice
