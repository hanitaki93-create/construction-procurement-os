name: B04-B06 PostgreSQL Failure Diagnostic

on:
  push:
    branches: [build/b04-b06-procurement-wave]
    paths:
      - '.github/workflows/ci-b04-b06-db-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpos_test
      MIGRATIONS_DIR: ../../migrations/sql
      BUILD_ID: b04-b06-db-diagnostic
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cpos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/b04-b06-procurement-wave
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
      - name: Run only B04-B06 database suites with JSON reporter
        shell: bash
        run: |
          set +e
          pnpm --filter @cpos/database-core exec vitest run --config vitest.integration.config.ts \
            integration/platform-b04-evidence-files.integration.test.ts \
            integration/platform-b05-requirements-allocation.integration.test.ts \
            integration/platform-b06-sourcing-rfq.integration.test.ts \
            --reporter=json --outputFile="${RUNNER_TEMP}/b04-b06-report.json"
          status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const p = process.env.RUNNER_TEMP + '/b04-b06-report.json';
          const r = JSON.parse(fs.readFileSync(p,'utf8'));
          const out = [];
          out.push(`success=${r.success} files=${r.numTotalTestSuites} tests=${r.numTotalTests} failed=${r.numFailedTests}`);
          const seen = new Set();
          for (const tr of r.testResults ?? []) {
            for (const a of tr.assertionResults ?? []) {
              if (a.status !== 'failed') continue;
              const msgs = a.failureMessages ?? [];
              const msg = msgs.join('\n').replace(/\u001b\[[0-9;]*m/g,'');
              const compact = msg.split('\n').filter(line => line.trim()).slice(0,18).join('\n');
              if (!seen.has(compact)) {
                seen.add(compact);
                out.push(`\nFILE ${tr.name}\nTEST ${a.fullName ?? a.title}\n${compact}`);
              }
              if (seen.size >= 6) break;
            }
            if (seen.size >= 6) break;
          }
          const text = out.join('\n');
          console.log(text);
          const escaped = text.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          console.log(`::error title=B04-B06 compact DB diagnostic::${escaped}`);
          NODE
          exit "$status"
