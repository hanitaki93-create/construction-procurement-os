name: MR S03 Live Entry Fix Clean

on:
  push:
    branches:
      - build/v2-erp-shell-requisition-slice
    paths:
      - '.github/workflows/mr-s03-live-entry-fix-clean.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean contaminated runner workspace and patch from fresh clone
        shell: bash
        run: |
          set -euo pipefail
          BAD='/opt/actions-runner/cpos/_work/construction-procurement-os/construction-procurement-os/.pnpm-store'
          sudo rm -rf "$BAD" 2>/dev/null || rm -rf "$BAD" 2>/dev/null || true
          TMP="/tmp/cpos-mr-s03-${GITHUB_RUN_ID}"
          rm -rf "$TMP"
          git clone --quiet --single-branch --branch build/v2-erp-shell-requisition-slice \
            "https://x-access-token:${GH_TOKEN}@github.com/hanitaki93-create/construction-procurement-os.git" "$TMP"
          cd "$TMP"
          python3 scripts/mr-s03-live-entry-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-internal/src/main-erp.tsx apps/web-internal/src/erp-requisition-s03.tsx deploy/erp-slice-03/browser-smoke.mjs
          git commit -m 'fix(erp): render MR S03 from the actual ERP entry'
          git push origin HEAD:build/v2-erp-shell-requisition-slice
          rm -rf "$TMP"
