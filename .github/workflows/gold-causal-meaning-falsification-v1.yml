name: Gold Causal Meaning Falsification V1

on:
  push:
    branches:
      - ops/gold-vps-bridge-20260814
    paths:
      - '.github/workflows/gold-causal-meaning-falsification-v1.yml'
      - 'ops/gold_research/run_causal_meaning_falsification_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gold-vps-bridge-20260814
          persist-credentials: false

      - name: Disposable Python environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gold-meaning-v1-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q pandas numpy scipy statsmodels
          echo "GOLD_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Verify consumed inputs only
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.cache/gold_research/full_upper_layer_probe/DFII5_2016_2017.csv"
          test -f "$HOME/.cache/gold_research/full_upper_layer_probe/gld_official_2016_2017.csv"
          test -d "$HOME/.cache/gold_research/oanda_2016"
          test -d "$HOME/.cache/gold_research/oanda_2017_holdout"
          test -f "$HOME/.cache/gold_research/prospective_state_machine_2016/event_state_ledger.csv"
          test -f "$HOME/.cache/gold_research/v4_2017_holdout/event_state_ledger.csv"

      - name: Run claim-level falsification
        shell: bash
        run: |
          set -euo pipefail
          "$GOLD_VENV/bin/python" ops/gold_research/run_causal_meaning_falsification_v1.py | tee "$RUNNER_TEMP/gold_meaning_v1_stdout.txt"
          OUT="$HOME/.cache/gold_research/causal_meaning_falsification_v1"
          test -f "$OUT/summary.json"
          grep -q '"preserved_2018_accessed": false' "$OUT/summary.json"

      - name: Stage outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gold_meaning_v1_artifact"
          cp -a "$HOME/.cache/gold_research/causal_meaning_falsification_v1/." "$RUNNER_TEMP/gold_meaning_v1_artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gold_meaning_v1_stdout.txt" "$RUNNER_TEMP/gold_meaning_v1_artifact/" 2>/dev/null || true

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-causal-meaning-falsification-v1
          path: ${{ runner.temp }}/gold_meaning_v1_artifact/**
          if-no-files-found: warn
          retention-days: 14
