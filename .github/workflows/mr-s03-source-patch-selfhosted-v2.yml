name: MR S03 Source Wiring Selfhosted V2

on:
  push:
    branches:
      - build/v2-erp-shell-requisition-slice
    paths:
      - '.github/workflows/mr-s03-source-patch-selfhosted-v2.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/v2-erp-shell-requisition-slice
          fetch-depth: 0
      - name: Apply deterministic S03 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mr-s03-source-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/src/procurement.ts \
                  packages/platform-application/src/persistence/procurement.ts \
                  packages/platform-application/src/procurement.ts \
                  apps/api/src/app.ts \
                  apps/web-internal/src/procurement.tsx \
                  apps/web-internal/src/erp-requisition-s03.tsx
          git commit -m 'feat(erp): wire governed MR slice 03 editing end to end'
          git push origin HEAD:build/v2-erp-shell-requisition-slice
