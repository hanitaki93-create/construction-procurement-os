name: ERP Slice 01 Requisition Preview

on:
  push:
    branches:
      - build/v2-erp-shell-requisition-slice
    paths:
      - 'apps/web-internal/**'
      - '.github/workflows/erp-slice-01-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-slice-01-preview
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build evidence-led ERP slice image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/v2-preview/Dockerfile -t "cpos-erp-slice-01:${GITHUB_SHA}" .

      - name: Verify shared V2 database runtime
        shell: bash
        run: |
          set -euo pipefail
          docker inspect cpos-v2-preview-db >/dev/null
          docker inspect cpos-v2-preview-net >/dev/null 2>&1 || docker network create cpos-v2-preview-net >/dev/null
          if [[ "$(docker inspect -f '{{.State.Running}}' cpos-v2-preview-db)" != "true" ]]; then
            docker start cpos-v2-preview-db >/dev/null
          fi
          for attempt in $(seq 1 30); do
            if docker exec cpos-v2-preview-db pg_isready -U postgres -d cpos >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cpos-v2-preview-db || true
          exit 1

      - name: Hostile-smoke ERP slice candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=cpos-erp-slice-01-candidate
          IMAGE="cpos-erp-slice-01:${GITHUB_SHA}"
          DATABASE_URL='postgresql://postgres@cpos-v2-preview-db:5432/cpos'

          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
          docker run -d \
            --name "$CANDIDATE" \
            --network cpos-v2-preview-net \
            -p 127.0.0.1:43122:43118 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BUILD_ID="erp-slice-01-${GITHUB_SHA}" \
            "$IMAGE" >/dev/null

          ready=false
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:43122/health/ready >/tmp/erp-slice-ready.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$CANDIDATE" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:43122/ >/tmp/erp-slice-root.html
          grep -q '<div id="root"></div>' /tmp/erp-slice-root.html
          docker rm -f "$CANDIDATE" >/dev/null

      - name: Promote ERP slice to public review port
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC=cpos-erp-slice-01
          PREVIOUS=cpos-v2-preview
          IMAGE="cpos-erp-slice-01:${GITHUB_SHA}"
          DATABASE_URL='postgresql://postgres@cpos-v2-preview-db:5432/cpos'

          docker rm -f "$PUBLIC" >/dev/null 2>&1 || true
          previous_was_running=false
          if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
            if [[ "$(docker inspect -f '{{.State.Running}}' "$PREVIOUS")" == "true" ]]; then
              previous_was_running=true
              docker stop "$PREVIOUS" >/dev/null
            fi
          fi

          rollback() {
            docker rm -f "$PUBLIC" >/dev/null 2>&1 || true
            if [[ "$previous_was_running" == "true" ]]; then
              docker start "$PREVIOUS" >/dev/null 2>&1 || true
            fi
          }
          trap rollback ERR

          docker run -d \
            --name "$PUBLIC" \
            --restart unless-stopped \
            --network cpos-v2-preview-net \
            -p 0.0.0.0:43120:43118 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BUILD_ID="erp-slice-01-${GITHUB_SHA}" \
            "$IMAGE" >/dev/null

          ready=false
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:43120/health/ready >/tmp/erp-slice-public-ready.json; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == "true" ]]
          curl -fsS http://127.0.0.1:43120/ >/tmp/erp-slice-public-root.html
          grep -q '<div id="root"></div>' /tmp/erp-slice-public-root.html
          trap - ERR

          echo 'ERP_SLICE_01_URL=http://18.181.166.50:43120'
          echo "ERP_SLICE_01_COMMIT=${GITHUB_SHA}"
          docker inspect -f 'CONTAINER={{.Name}} STATE={{.State.Status}} RESTART={{.RestartCount}} PORTS={{json .NetworkSettings.Ports}}' "$PUBLIC"
          cat /tmp/erp-slice-public-ready.json
