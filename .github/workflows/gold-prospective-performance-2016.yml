name: Gold Prospective Performance 2016

on:
  push:
    branches:
      - ops/gold-vps-bridge-20260814
    paths:
      - '.github/workflows/gold-prospective-performance-2016.yml'
      - 'ops/gold_research/audit_prospective_state_performance_2016.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gold-vps-bridge-20260814
          persist-credentials: false

      - name: Disposable Python environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gold-performance-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q pandas numpy requests
          echo "GOLD_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Patch imported helper pandas collision if present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/gold_research/run_oanda_macro_transition_replay_2016.py')
          s=p.read_text()
          old='thresholds_df[thresholds_df.quantile == q]'
          if old in s:
              p.write_text(s.replace(old, 'thresholds_df[thresholds_df["quantile"] == q]', 1))
          PY

      - name: Run performance audit
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.cache/gold_research/prospective_state_machine_2016/exposure_actions.csv"
          "$GOLD_VENV/bin/python" ops/gold_research/audit_prospective_state_performance_2016.py | tee "$RUNNER_TEMP/gold_prospective_performance_2016_stdout.txt"
          grep -q '"preserved_2017_accessed": false' "$HOME/.cache/gold_research/prospective_state_machine_2016/performance_audit/summary.json"

      - name: Stage outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gold_performance_artifact"
          cp -a "$HOME/.cache/gold_research/prospective_state_machine_2016/performance_audit/." "$RUNNER_TEMP/gold_performance_artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gold_prospective_performance_2016_stdout.txt" "$RUNNER_TEMP/gold_performance_artifact/" 2>/dev/null || true

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-prospective-performance-2016
          path: ${{ runner.temp }}/gold_performance_artifact/**
          if-no-files-found: warn
          retention-days: 14
