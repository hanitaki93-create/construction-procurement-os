name: Isolated ETH Candlestick Research V1

on:
  push:
    branches:
      - research/isolated-eth-candlestick-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-eth-candlestick-v1
  cancel-in-progress: false

jobs:
  research:
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/isolated-eth-candlestick-v1
          fetch-depth: 1
          clean: false

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/eth-candlestick-study-v1-${GITHUB_RUN_ID}"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "runner_user=$(whoami)"
            echo "host=$(hostname)"
            echo "work=$WORK"
            echo "=== uptime ==="
            uptime
            echo "=== memory ==="
            free -m
            echo "=== disk ==="
            df -h "$RUNNER_TEMP"
            echo "=== procurement/runtime processes before ==="
            ps -eo pid,ni,comm,args --sort=pid | grep -E 'node|pm2|docker|nginx|postgres|construction|procurement' | grep -v grep | head -n 100 || true
          } | tee "$WORK/safety_preflight.txt"
          MEM_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          [ "$MEM_KB" -ge 1200000 ] || { echo "ABORT_LOW_MEMORY MemAvailable_kB=$MEM_KB"; exit 75; }
          DISK_KB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          [ "$DISK_KB" -ge 2000000 ] || { echo "ABORT_LOW_DISK Available_kB=$DISK_KB"; exit 76; }

      - name: Prepare isolated Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python3)"
          if "$PY" -c 'import numpy,pandas,scipy,tabulate,talib' >/dev/null 2>&1; then
            echo "Using existing Python packages read-only"
          else
            mkdir -p "$WORK/vendor"
            nice -n 19 ionice -c3 "$PY" -m pip install --no-cache-dir --target "$WORK/vendor" numpy pandas scipy tabulate TA-Lib
            export PYTHONPATH="$WORK/vendor${PYTHONPATH:+:$PYTHONPATH}"
            echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          fi
          "$PY" - <<'PYVER' | tee "$WORK/python_versions.txt"
          import sys, numpy, pandas, scipy, tabulate, talib
          print('python', sys.version.replace('\n',' '))
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('tabulate', tabulate.__version__)
          print('talib', talib.__version__)
          print('talib_patterns', len(talib.get_function_groups()['Pattern Recognition']))
          PYVER
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Reconstruct and verify 2025 candles from Binance public archive
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/research_tools/eth_candlestick_v1/reconstruct_binance_2025.py" "$WORK/reconstruct_binance_2025.py"
          cd "$WORK"
          nice -n 19 ionice -c3 "$PY" reconstruct_binance_2025.py 2>&1 | tee reconstruction.log
          test -s reconstruction_audit.json
          "$PY" - <<'PYAUDIT'
          import json
          a=json.load(open('reconstruction_audit.json'))
          assert a['status']=='PASS', a
          for s in ('ETHUSDT','BTCUSDT'):
              assert a['symbols'][s]['5m_rows']==105120, a['symbols'][s]
              assert a['symbols'][s]['1h_rows']==8760, a['symbols'][s]
              assert a['symbols'][s]['1h_hash_match'] is True, a['symbols'][s]
          print('RECONSTRUCTION_AUDIT_PASS')
          PYAUDIT

      - name: Run frozen candlestick study at lowest priority
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/research_tools/eth_candlestick_v1/candlestick_pattern_research_v1.py" "$WORK/candlestick_pattern_research_v1.py"
          cd "$WORK"
          sha256sum candlestick_pattern_research_v1.py ETHUSDT_5m_2025.csv.gz BTCUSDT_5m_2025.csv.gz ETHUSDT_1h_2025.csv BTCUSDT_1h_2025.csv | tee study_input_sha256.txt
          nice -n 19 ionice -c3 "$PY" candlestick_pattern_research_v1.py 2>&1 | tee candlestick_run.log
          test -s candlestick_research_outputs/RESULTS.md
          test -s candlestick_research_outputs/candlestick_pattern_surface.csv
          test -s candlestick_research_outputs/manifest.json
          cat candlestick_research_outputs/manifest.json

      - name: Safety postflight
        if: always()
        shell: bash
        run: |
          set +e
          WORK="${WORK:-$RUNNER_TEMP/eth-candlestick-study-v1-${GITHUB_RUN_ID}}"
          mkdir -p "$WORK"
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "=== uptime ==="
            uptime
            echo "=== memory ==="
            free -m
            echo "=== procurement/runtime processes after ==="
            ps -eo pid,ni,comm,args --sort=pid | grep -E 'node|pm2|docker|nginx|postgres|construction|procurement' | grep -v grep | head -n 100 || true
          } | tee "$WORK/safety_postflight.txt"

      - name: Upload compact research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-eth-candlestick-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/candlestick_research_outputs
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/reconstruction_audit.json
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/reconstruction.log
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/python_versions.txt
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/study_input_sha256.txt
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/candlestick_run.log
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/safety_preflight.txt
            ${{ runner.temp }}/eth-candlestick-study-v1-${{ github.run_id }}/safety_postflight.txt
          if-no-files-found: warn
          retention-days: 14
