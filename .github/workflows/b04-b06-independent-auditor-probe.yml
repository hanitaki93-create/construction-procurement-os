name: B04-B06 Independent Auditor Capability Probe

on:
  push:
    branches: [audit/b04-b06-complete-source-20260812]
    paths:
      - '.github/workflows/b04-b06-independent-auditor-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/b04-b06-complete-source-20260812
          persist-credentials: false
      - name: Report independent-auditor capability without secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          for command in claude anthropic; do
            if command -v "$command" >/dev/null 2>&1; then
              echo "$command=present"
              "$command" --version 2>/dev/null | head -n 1 || true
            else
              echo "$command=absent"
            fi
          done
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then echo 'ANTHROPIC_API_KEY=present'; else echo 'ANTHROPIC_API_KEY=absent'; fi
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then echo 'CLAUDE_CODE_OAUTH_TOKEN=present'; else echo 'CLAUDE_CODE_OAUTH_TOKEN=absent'; fi
