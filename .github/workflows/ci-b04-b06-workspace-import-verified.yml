name: B04-B06 Verified Workspace Import

on:
  push:
    branches: [ci/b04-b06-workspace-import-verified]
    paths:
      - '.import-staging/B04_B06_READY'

permissions:
  contents: write

jobs:
  import:
    name: Verify and publish recovered source payload
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 10
    steps:
      - name: Check out exact import branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/b04-b06-workspace-import-verified
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and verify exact recovered payload
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 516 .import-staging/chunk.000
            printf 'n'
            tail -c +517 .import-staging/chunk.000
          } > "${RUNNER_TEMP}/chunk.000.repaired"
          {
            head -c 3609 .import-staging/chunk.003
            printf 't'
            tail -c +3610 .import-staging/chunk.003
          } > "${RUNNER_TEMP}/chunk.003.repaired"
          test "$(wc -c < "${RUNNER_TEMP}/chunk.000.repaired")" -eq 6000
          test "$(wc -c < "${RUNNER_TEMP}/chunk.003.repaired")" -eq 6000
          echo 'dc2b98db43049e5765c25feb94c42647be8b9fcfbd673d260f59f8339df28800  '${RUNNER_TEMP}'/chunk.000.repaired' | sha256sum -c -
          echo '9bcf109156f4b50952536b3234e42f4b3c054bd9f93ae8ad8d35dd60ef225818  '${RUNNER_TEMP}'/chunk.003.repaired' | sha256sum -c -
          : > "${RUNNER_TEMP}/payload.b64"
          for index in $(seq -w 0 14); do
            case "$index" in
              00) cat "${RUNNER_TEMP}/chunk.000.repaired" >> "${RUNNER_TEMP}/payload.b64" ;;
              03) cat "${RUNNER_TEMP}/chunk.003.repaired" >> "${RUNNER_TEMP}/payload.b64" ;;
              *) cat ".import-staging/chunk.0${index}" >> "${RUNNER_TEMP}/payload.b64" ;;
            esac
          done
          tr -d '\r\n' < "${RUNNER_TEMP}/payload.b64" > "${RUNNER_TEMP}/payload.clean.b64"
          base64 -d "${RUNNER_TEMP}/payload.clean.b64" > "${RUNNER_TEMP}/payload.tar.gz"
          echo '34aa2f9cc0713566b05e378a5500d63f833165751619ea7ca9d0ba621aade4a5  '${RUNNER_TEMP}'/payload.tar.gz' | sha256sum -c -
          tar -tzf "${RUNNER_TEMP}/payload.tar.gz" > "${RUNNER_TEMP}/tar-files.txt"
          test "$(wc -l < "${RUNNER_TEMP}/tar-files.txt")" -eq 29
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "${RUNNER_TEMP}/tar-files.txt"; then
            echo 'unsafe archive path detected' >&2
            exit 1
          fi
          sort .import-staging/files.txt > "${RUNNER_TEMP}/expected-files.txt"
          sort "${RUNNER_TEMP}/tar-files.txt" > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          tar -xzf "${RUNNER_TEMP}/payload.tar.gz" -C .
          sha256sum -c .import-staging/source.sha256
      - name: Commit checksum-proven non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build-staging/b04-b06
          rm -rf .import-staging
          rm -f .github/workflows/b04-b06-focused-verification.yml
          rm -f .github/workflows/b04-b06-lockfile-refresh.yml
          git config user.name 'cpos-ci-import'
          git config user.email 'cpos-ci-import@users.noreply.github.com'
          git add -A -- ':!.github/workflows/ci-b04-b06-workspace-import-verified.yml'
          git diff --cached --check
          git commit -m 'build: publish recovered B04-B06 implementation source'
          git push origin HEAD:ci/b04-b06-workspace-import-verified
