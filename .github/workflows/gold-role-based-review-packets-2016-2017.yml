name: Gold Role Based Review Packets 2016 2017

on:
  push:
    branches: [ops/gold-vps-bridge-20260814]
    paths:
      - '.github/workflows/gold-role-based-review-packets-2016-2017.yml'
      - 'ops/gold_research/build_role_based_review_packets_2016_2017.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gold-vps-bridge-20260814
          persist-credentials: false
      - name: Disposable Python environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gold-role-packets-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q pandas numpy openpyxl
          echo "GOLD_VENV=$VENV" >> "$GITHUB_ENV"
      - name: Verify consumed inputs only
        shell: bash
        run: |
          set -euo pipefail
          test -d "$HOME/.cache/gold_research/oanda_2016"
          test -d "$HOME/.cache/gold_research/oanda_2017_holdout"
          test -f "$HOME/.cache/gold_research/full_upper_layer_probe/gld_official_historical_archive.xlsx"
      - name: Build deterministic review calendar and packets
        shell: bash
        run: |
          set -euo pipefail
          "$GOLD_VENV/bin/python" ops/gold_research/build_role_based_review_packets_2016_2017.py | tee "$RUNNER_TEMP/gold_role_packets_stdout.txt"
          OUT="$HOME/.cache/gold_research/role_based_review_packets_2016_2017"
          test -f "$OUT/build_summary.json"
          grep -q '"preserved_2018_accessed": false' "$OUT/build_summary.json"
      - name: Stage outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gold_role_packets_artifact"
          cp -a "$HOME/.cache/gold_research/role_based_review_packets_2016_2017/." "$RUNNER_TEMP/gold_role_packets_artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gold_role_packets_stdout.txt" "$RUNNER_TEMP/gold_role_packets_artifact/" 2>/dev/null || true
      - name: Upload packet build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-role-based-review-packets-2016-2017
          path: ${{ runner.temp }}/gold_role_packets_artifact/**
          if-no-files-found: warn
          retention-days: 14
