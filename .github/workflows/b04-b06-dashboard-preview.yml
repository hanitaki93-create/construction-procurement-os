name: B04-B06 Dashboard Pending-Pass Preview

on:
  push:
    branches: [preview/b04-b06-dashboard-pending-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Verify preview lineage and dashboard build
        shell: bash
        run: |
          set -euo pipefail
          audit_target='4f9de1ed60bbd138f1b96a8b7e7e08af403b7c15'
          git merge-base --is-ancestor "$audit_target" HEAD
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @cpos/api typecheck
          pnpm --filter @cpos/api test
          pnpm --filter @cpos/ui-foundation build
          pnpm --filter @cpos/web-internal typecheck
          pnpm --filter @cpos/web-internal build
      - name: Build, hostile-smoke, and expose preview
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="cpos-b04-b06-preview:${GITHUB_SHA}"
          CANDIDATE="cpos-b04-b06-preview-candidate"
          LIVE="cpos-b04-b06-preview"
          CANDIDATE_PORT=43121
          PUBLIC_PORT=43120
          PROJECT_ID='019d6666-6666-7666-8666-666666666662'
          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
          docker build -f deploy/b02-demo/Dockerfile -t "$IMAGE" .
          docker run -d --name "$CANDIDATE" -p "127.0.0.1:${CANDIDATE_PORT}:43118" "$IMAGE" >/dev/null
          for attempt in $(seq 1 45); do curl -fsS "http://127.0.0.1:${CANDIDATE_PORT}/" >/dev/null && break; sleep 1; done
          SESSION=(-H 'x-cpos-session-mode: development' -H 'x-cpos-tenant-id: 019d1111-1111-7111-8111-111111111111' -H 'x-cpos-principal-id: 019d3333-3333-7333-8333-333333333333')
          PLATFORM="$(curl -fsS "${SESSION[@]}" "http://127.0.0.1:${CANDIDATE_PORT}/platform/workspace")"
          PROCUREMENT="$(curl -fsS "${SESSION[@]}" "http://127.0.0.1:${CANDIDATE_PORT}/procurement/workspace?projectId=${PROJECT_ID}")"
          grep -Fq 'CPOS Demo Contractor' <<<"$PLATFORM"
          grep -Fq 'RFQ-UAQ-001' <<<"$PROCUREMENT"
          grep -Fq 'BOQ-CIV-001' <<<"$PROCUREMENT"
          grep -Fq 'UAQ_BoQ_Rev02.pdf' <<<"$PROCUREMENT"
          docker rm -f "$CANDIDATE" >/dev/null
          docker rm -f cpos-b02-demo >/dev/null 2>&1 || true
          docker rm -f "$LIVE" >/dev/null 2>&1 || true
          docker run -d --name "$LIVE" --restart unless-stopped --label cpos.surface=b04-b06-pending-pass --label "cpos.audit-target=4f9de1ed60bbd138f1b96a8b7e7e08af403b7c15" -p "0.0.0.0:${PUBLIC_PORT}:43118" "$IMAGE" >/dev/null
          for attempt in $(seq 1 45); do curl -fsS "http://127.0.0.1:${PUBLIC_PORT}/procurement/workspace?projectId=${PROJECT_ID}" "${SESSION[@]}" >/dev/null && break; sleep 1; done
          PUBLIC_IP="$(curl -fsS --max-time 5 https://checkip.amazonaws.com 2>/dev/null | tr -d '[:space:]' || true)"
          echo "OWNER_WORKING_STATUS=PENDING_PASS"
          echo "INDEPENDENT_AUDIT_GATE=PENDING_REAUDIT"
          echo "B07=LOCKED_NOT_STARTED"
          echo "CPOS_B04_B06_PREVIEW_LOCAL_URL=http://127.0.0.1:${PUBLIC_PORT}"
          if [[ -n "$PUBLIC_IP" ]]; then echo "CPOS_B04_B06_PREVIEW_URL=http://${PUBLIC_IP}:${PUBLIC_PORT}"; fi
