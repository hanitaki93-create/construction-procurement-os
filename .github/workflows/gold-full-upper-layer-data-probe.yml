name: Gold Full Upper Layer Data Probe

on:
  push:
    branches: [ops/gold-vps-bridge-20260814]
    paths:
      - '.github/workflows/gold-full-upper-layer-data-probe.yml'
      - 'ops/gold_research/probe_full_upper_layer_data.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, cpos-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gold-vps-bridge-20260814
          persist-credentials: false
      - name: Disposable Python environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/gold-upper-data-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check -q pandas requests openpyxl
          echo "GOLD_VENV=$VENV" >> "$GITHUB_ENV"
      - name: Probe official sources
        shell: bash
        run: |
          set -euo pipefail
          "$GOLD_VENV/bin/python" ops/gold_research/probe_full_upper_layer_data.py | tee "$RUNNER_TEMP/gold_upper_data_probe_stdout.txt"
          OUT="$HOME/.cache/gold_research/full_upper_layer_probe"
          test -f "$OUT/audit.json"
          grep -q '"preserved_2018_xau_accessed": false' "$OUT/audit.json"
      - name: Stage outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gold_upper_data_artifact"
          cp -a "$HOME/.cache/gold_research/full_upper_layer_probe/." "$RUNNER_TEMP/gold_upper_data_artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gold_upper_data_probe_stdout.txt" "$RUNNER_TEMP/gold_upper_data_artifact/" 2>/dev/null || true
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-full-upper-layer-data-probe
          path: ${{ runner.temp }}/gold_upper_data_artifact/**
          if-no-files-found: warn
          retention-days: 14
