name: B01 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/b01-*.yml'
      - '.editorconfig'
      - '.env.example'
      - '.gitignore'
      - '.node-version'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - 'apps/**'
      - 'docs/build/**'
      - 'eslint.config.mjs'
      - 'migrations/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 workspace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate exact pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"

      - name: Require committed lockfile
        shell: bash
        run: test -f pnpm-lock.yaml

      - name: Install from the exact lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run complete current B01 verification
        shell: bash
        run: pnpm verify
