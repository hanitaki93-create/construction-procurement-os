name: B01 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/b01-*.yml'
      - '.editorconfig'
      - '.env.example'
      - '.gitignore'
      - '.node-version'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - 'apps/**'
      - 'docs/build/**'
      - 'eslint.config.mjs'
      - 'migrations/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 workspace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate exact pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"

      - name: Require committed lockfile
        shell: bash
        run: test -f pnpm-lock.yaml

      - name: Install from the exact lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run complete current B01 verification
        shell: bash
        run: pnpm verify

      - name: Assemble share-ready B01 audit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="B01_AUDIT_SHARE_PACKAGE"
          IMPLEMENTATION_SHA="1344a64454154bc624197b2a885bad9f8da9dafc"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/01_IMPLEMENTATION_SNAPSHOT" "$ROOT/02_AUDIT_MATERIALS"
          git archive "$IMPLEMENTATION_SHA" | tar -x -C "$ROOT/01_IMPLEMENTATION_SNAPSHOT"
          cp -R docs/build/B01_FREEZE_PACKAGE "$ROOT/02_AUDIT_MATERIALS/"
          cp -R docs/build/B01_HOSTILE_AUDIT_PACKAGE "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_COMPLETION_EVIDENCE_V1_0_CANDIDATE.md "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_VERSION_MANIFEST.md "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_F5_VERIFICATION.md "$ROOT/02_AUDIT_MATERIALS/"
          printf '%s\n' \
            'B01 INDEPENDENT HOSTILE AUDIT SHARE PACKAGE' \
            '' \
            'Audit target implementation commit:' \
            "$IMPLEMENTATION_SHA" \
            '' \
            'Package contents:' \
            '01_IMPLEMENTATION_SNAPSHOT - complete unmodified repository tree at the audit target commit.' \
            '02_AUDIT_MATERIALS - freeze candidate, hostile audit prompt, response template and supporting evidence.' \
            '' \
            'Start with:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/00_READ_FIRST.md' \
            '' \
            'Then use:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/02_HOSTILE_AUDIT_PROMPT.md' \
            '' \
            'Return the verdict using:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/03_AUDIT_RESPONSE_TEMPLATE.md' \
            '' \
            'Do not treat builder summaries or previous PASS statements as proof. Inspect the implementation snapshot directly.' \
            > "$ROOT/00_READ_ME_FIRST.txt"
          printf '%s\n' "$IMPLEMENTATION_SHA" > "$ROOT/IMPLEMENTATION_SHA.txt"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"

      - name: Upload B01 audit package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: B01_AUDIT_SHARE_PACKAGE
          path: B01_AUDIT_SHARE_PACKAGE
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
