name: B01 F1 Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/b01-f1-foundation.yml'
      - '.editorconfig'
      - '.gitignore'
      - '.node-version'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - 'docs/build/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'packages/tooling-config/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-f1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Node 24 foundation verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate exact pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"

      - name: Require committed lockfile
        shell: bash
        run: test -f pnpm-lock.yaml

      - name: Install from the exact lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify root manifests
        shell: bash
        run: pnpm manifests:check

      - name: Verify architecture boundaries
        shell: bash
        run: pnpm architecture:check

      - name: Verify formatting
        shell: bash
        run: pnpm format:check

      - name: Verify linting
        shell: bash
        run: pnpm lint

      - name: Verify types
        shell: bash
        run: pnpm typecheck

      - name: Run foundation tests
        shell: bash
        run: pnpm test

      - name: Build foundation packages
        shell: bash
        run: pnpm build
