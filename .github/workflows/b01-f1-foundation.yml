name: B01 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/b01-*.yml'
      - '.editorconfig'
      - '.env.example'
      - '.gitignore'
      - '.node-version'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - 'apps/**'
      - 'docs/build/**'
      - 'eslint.config.mjs'
      - 'migrations/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 workspace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate exact pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.34.0"

      - name: Require committed lockfile
        shell: bash
        run: test -f pnpm-lock.yaml

      - name: Install from the exact lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run complete current B01 verification
        shell: bash
        run: pnpm verify

      - name: Assemble complete remediated B01 re-audit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="B01_REAUDIT_SHARE_PACKAGE"
          IMPLEMENTATION_SHA="3f4d89eea1d44b94d458cfb5f4e9dcc2c9b9f6e8"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/01_IMPLEMENTATION_SNAPSHOT" "$ROOT/02_AUDIT_MATERIALS"
          git archive "$IMPLEMENTATION_SHA" | tar -x -C "$ROOT/01_IMPLEMENTATION_SNAPSHOT"
          cp -R docs/build/B01_FREEZE_PACKAGE "$ROOT/02_AUDIT_MATERIALS/"
          cp -R docs/build/B01_HOSTILE_AUDIT_PACKAGE "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_COMPLETION_EVIDENCE_V1_0_CANDIDATE.md "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_VERSION_MANIFEST.md "$ROOT/02_AUDIT_MATERIALS/"
          cp docs/build/B01_F5_VERIFICATION.md "$ROOT/02_AUDIT_MATERIALS/"
          test -f "$ROOT/01_IMPLEMENTATION_SNAPSHOT/.node-version"
          test -d "$ROOT/01_IMPLEMENTATION_SNAPSHOT/.github/workflows"
          test -f "$ROOT/01_IMPLEMENTATION_SNAPSHOT/.gitignore"
          test -f "$ROOT/01_IMPLEMENTATION_SNAPSHOT/.dockerignore"
          test -f "$ROOT/01_IMPLEMENTATION_SNAPSHOT/.env.example"
          printf '%s\n' \
            'B01 TARGETED INDEPENDENT RE-AUDIT SHARE PACKAGE' \
            '' \
            'Remediated implementation commit:' \
            "$IMPLEMENTATION_SHA" \
            '' \
            'The first audit returned FAIL. Both blockers were accepted and remediated.' \
            '' \
            'Start with:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/00_READ_FIRST.md' \
            '' \
            'Then use:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/07_TARGETED_REAUDIT_PROMPT.md' \
            '' \
            'Return the verdict using:' \
            '02_AUDIT_MATERIALS/B01_HOSTILE_AUDIT_PACKAGE/03_AUDIT_RESPONSE_TEMPLATE.md' \
            '' \
            '01_IMPLEMENTATION_SNAPSHOT is a complete git archive at the exact remediation target.' \
            'Required dotfiles and .github/workflows were asserted before this package was uploaded.' \
            'Do not treat builder summaries or green CI as proof.' \
            > "$ROOT/00_READ_ME_FIRST.txt"
          printf '%s\n' "$IMPLEMENTATION_SHA" > "$ROOT/IMPLEMENTATION_SHA.txt"
          find "$ROOT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          grep -F '/01_IMPLEMENTATION_SNAPSHOT/.node-version' "$ROOT/SHA256SUMS.txt"
          grep -F '/01_IMPLEMENTATION_SNAPSHOT/.github/workflows/' "$ROOT/SHA256SUMS.txt"

      - name: Upload complete B01 re-audit package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: B01_REAUDIT_SHARE_PACKAGE
          path: B01_REAUDIT_SHARE_PACKAGE
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
